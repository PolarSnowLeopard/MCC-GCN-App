server {
    listen 80;
    root /usr/share/nginx/html;

    # VitePress builds with cleanUrls=true: the file on disk is `foo.html`
    # while the canonical URL is `/foo`. We try the literal path, then `.html`,
    # then a directory, then fall through to the SPA root.
    location /docs/ {
        try_files $uri $uri.html $uri/ /docs/index.html;
    }

    location = /docs {
        return 301 /docs/;
    }

    # Long cache for hashed assets that VitePress emits under assets/.
    location /docs/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
