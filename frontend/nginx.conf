server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build artifacts (assets/*.js, assets/*.css, ...) carry a
    # content-hash in their filename, so they're safe to cache forever.
    # If a file is missing, return a real 404 instead of falling back to
    # index.html — that way the browser sees the failure as a chunk load
    # error (handled by the router) instead of getting HTML where it
    # expected JS.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA history-mode fallback: any unknown route serves index.html so
    # the Vue router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, otherwise a returning user
    # whose cached copy was built before a redeploy will keep requesting
    # chunk hashes that no longer exist on the server.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        expires 0;
    }
}
