# Re-resolve upstream service names through Docker's embedded DNS server
# (127.0.0.11) every `valid=` seconds. This makes the proxy survive
# `docker compose up -d --force-recreate <service>` without needing to
# restart the nginx container — the new container's IP is picked up
# automatically once the cached DNS entry expires.
resolver 127.0.0.11 valid=10s ipv6=off;

# HTTP: redirect everything to HTTPS, but keep ACME challenge path open
# so that webroot-based certificate renewal can be enabled later.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: main entry point. server_name is intentionally catch-all so that
# changing the public domain does not require editing this file.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 50M;

    # NOTE: proxy_pass uses a variable (e.g. http://$backend) instead of an
    # `upstream {}` block so that the resolver above is actually consulted
    # at request time (nginx OSS resolves `upstream` server names only
    # once at startup).

    location /api/ {
        set $backend_host backend:8000;
        proxy_pass http://$backend_host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /admin/ {
        set $backend_host backend:8000;
        proxy_pass http://$backend_host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /static/ {
        set $backend_host backend:8000;
        proxy_pass http://$backend_host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /media/ {
        set $backend_host backend:8000;
        proxy_pass http://$backend_host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /docs/ {
        set $docs_host docs:80;
        proxy_pass http://$docs_host;
        proxy_set_header Host $host;
    }

    location = /docs {
        return 301 /docs/;
    }

    location / {
        set $frontend_host frontend:80;
        proxy_pass http://$frontend_host;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
