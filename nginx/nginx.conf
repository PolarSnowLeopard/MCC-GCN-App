upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

upstream docs {
    server docs:80;
}

# HTTP: redirect everything to HTTPS, but keep ACME challenge path open
# so that webroot-based certificate renewal can be enabled later.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: main entry point. server_name is intentionally catch-all so that
# changing the public domain does not require editing this file.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /static/ {
        proxy_pass http://backend;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /media/ {
        proxy_pass http://backend;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /docs/ {
        proxy_pass http://docs;
        proxy_set_header Host $host;
    }

    location = /docs {
        return 301 /docs/;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
